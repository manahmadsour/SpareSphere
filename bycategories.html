<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparespher - Categories</title>
    <link rel="stylesheet" href="bycategories.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <img src="images/logo.jpg" alt="SpareSphere Logo" id="logo">
            <div class="site-name">SpareSphere</div>
        </div>
        <a href="login.html" id="login-link">
            <img src="images/login.png" alt="Login Icon">
        </a>
        <div class="hamburger" onclick="toggleNav()">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="bycategories.html">Shop by Category</a>
            <a href="shop.html">Deals</a>
            <a href="cart.html">Cart</a>
            <a href="#">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section id="categories-section">
        <h1>Categories</h1>
        <section class="categories">
            <div id="cpu" class="category-card">
                <img src="https://th.bing.com/th?id=OIP.k5aOhvY5U-C23BLYwDGmRgHaEo&w=316&h=197&c=8&rs=1&qlt=90&o=6&pid=3.1&rm=2" alt="CPU">
                <h3 class="card-title">CPUs</h3>
            </div>
            <div id="gpu" class="category-card">
                <img src="images/gpu img.png" alt="GPU">
                <h3 class="card-title">GPUs</h3>
            </div>
            <div id="motherboard" class="category-card">
                <img src="images/motherboard img.jpg" alt="Motherboard">
                <h3 class="card-title">Motherboards</h3>
            </div>
            <div id="ram" class="category-card">
                <img src="https://th.bing.com/th/id/OIP.ykKYxUFph92pNZZugw3U0wHaE8?w=262&h=180&c=7&r=0&o=5&pid=1.7" alt="RAM">
                <h3 class="card-title">RAM</h3>
            </div>
            <div id="accessories" class="category-card">
                <img src="images/Accessories.png" alt="Accessories">
                <h3 class="card-title">Accessories</h3>
            </div>
        </section>
    </section>

    <script src="bycategories.js"></script>
    <script src="script.js"></script>
</body>
</html>
